{# Animations du site : apparitions douces, boutons vivants, zone de dépôt, envoi, copie de lien.
   Tout est coupé si le visiteur a demandé moins d'animations dans les réglages de son appareil. #}
<style>
/* ---------- apparition des blocs au chargement et au défilement ---------- */
.mx-reveal {
  opacity: 0;
  transform: translateY(18px) scale(.985);
  transition: opacity .55s ease, transform .55s cubic-bezier(.2, .8, .2, 1);
  transition-delay: var(--mx-delay, 0ms);
}
.mx-reveal.mx-in { opacity: 1; transform: none; }

.topbar { animation: mx-drop .6s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes mx-drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }

.season-banner { animation: mx-pop .6s .25s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes mx-pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }

/* ---------- liens du menu ---------- */
.header-nav a { position: relative; transition: color .2s ease; }
.header-nav a::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -4px;
  height: 2px;
  border-radius: 2px;
  background: var(--pix-primary, #4f46e5);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .25s ease;
}
.header-nav a:hover::after, .header-nav a:focus-visible::after { transform: scaleX(1); }

.language-switcher a { display: inline-block; transition: transform .2s ease; }
.language-switcher a:hover { transform: translateY(-2px) scale(1.12); }

.brand-link img { transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); }
.brand-link:hover img { transform: rotate(-8deg) scale(1.08); }

/* ---------- boutons ---------- */
.btn { position: relative; overflow: hidden; transition: transform .15s ease, box-shadow .2s ease, background-color .2s ease, filter .2s ease; }
.btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(15, 23, 42, .12); }
.btn:not(:disabled):active { transform: translateY(0) scale(.97); box-shadow: none; }
.mx-ripple {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  background: rgba(255, 255, 255, .45);
  transform: scale(0);
  animation: mx-ripple .6s ease-out forwards;
}
.btn-outline-primary .mx-ripple, .btn-outline-secondary .mx-ripple, .btn-outline-dark .mx-ripple, .btn-light .mx-ripple { background: rgba(79, 70, 229, .18); }
@keyframes mx-ripple { to { transform: scale(2.6); opacity: 0; } }

/* bouton d'envoi : barre animée pendant l'envoi */
.btn.mx-loading { pointer-events: none; filter: saturate(1.1); }
.btn.mx-loading::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0;
  height: 3px; width: 40%;
  border-radius: 3px;
  background: rgba(255, 255, 255, .85);
  animation: mx-progress 1.1s ease-in-out infinite;
}
.mx-spinner {
  display: inline-block;
  width: 1em; height: 1em;
  margin-right: .45em;
  vertical-align: -0.15em;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: mx-spin .7s linear infinite;
}
@keyframes mx-progress { 0% { left: -40%; } 100% { left: 100%; } }
@keyframes mx-spin { to { transform: rotate(360deg); } }

/* bouton « Copier » : confirmation */
.btn.mx-copied { animation: mx-bounce .45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes mx-bounce { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }

/* ---------- cartes ---------- */
.card { transition: transform .25s ease, box-shadow .25s ease; }
@media (hover: hover) {
  .card.mx-hover:hover { transform: translateY(-3px); box-shadow: 0 16px 34px rgba(15, 23, 42, .10) !important; }
}

/* ---------- zone de dépôt ---------- */
.dropzone { transition: transform .2s ease, border-color .2s ease, background-color .2s ease, box-shadow .2s ease !important; }
.dropzone:hover { transform: translateY(-1px); border-color: var(--pix-primary, #4f46e5) !important; }
.dropzone .dz-title::before {
  content: "⬆";
  display: block;
  font-size: 1.6rem;
  line-height: 1;
  margin-bottom: 6px;
  color: var(--pix-primary, #4f46e5);
  animation: mx-float 2.4s ease-in-out infinite;
}
.dropzone.dragover {
  transform: scale(1.02);
  box-shadow: 0 0 0 6px var(--pix-primary-soft, rgba(79, 70, 229, .12));
  animation: mx-dash 1s linear infinite;
}
.dropzone.dragover .dz-title::before { animation: mx-jump .5s ease-in-out infinite alternate; }
.dropzone.mx-picked { animation: mx-picked .5s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes mx-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes mx-jump { from { transform: translateY(0); } to { transform: translateY(-9px); } }
@keyframes mx-dash { 50% { border-color: rgba(79, 70, 229, .35); } }
@keyframes mx-picked { 0% { transform: scale(1); } 40% { transform: scale(1.03); } 100% { transform: scale(1); } }

/* ---------- messages (succès, erreur...) ---------- */
.flash-stack .alert { animation: mx-slide .45s cubic-bezier(.2, .8, .2, 1) both; }
.flash-stack .alert.mx-out { transition: opacity .4s ease, transform .4s ease; opacity: 0; transform: translateY(-8px); }
@keyframes mx-slide { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }

/* ---------- champs ---------- */
.form-control, .form-select { transition: border-color .2s ease, box-shadow .25s ease, transform .2s ease; }
.form-control:focus, .form-select:focus { transform: translateY(-1px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .mx-reveal { opacity: 1; transform: none; }
}
</style>

{% macro motion_script() -%}
<script>
(() => {
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* 1. Les blocs apparaissent en douceur, l'un après l'autre. */
  const blocks = document.querySelectorAll(".container-shell .card, .container-shell > section, .container-shell .row > [class*='col'] > .card");
  const seen = new Set();
  const targets = [];
  blocks.forEach((el) => { if (!seen.has(el)) { seen.add(el); targets.push(el); } });
  if (!reduce && "IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) { entry.target.classList.add("mx-in"); io.unobserve(entry.target); }
      });
    }, { threshold: 0.08 });
    targets.forEach((el, i) => {
      el.classList.add("mx-reveal");
      el.style.setProperty("--mx-delay", Math.min(i, 6) * 70 + "ms");
      io.observe(el);
    });
    // Filet de sécurité : rien ne doit rester caché.
    setTimeout(() => targets.forEach((el) => el.classList.add("mx-in")), 2500);
  }
  document.querySelectorAll(".card").forEach((c) => { if (!c.querySelector("form")) c.classList.add("mx-hover"); });

  /* 2. Effet d'onde au clic sur les boutons. */
  document.addEventListener("pointerdown", (e) => {
    const btn = e.target.closest(".btn");
    if (!btn || btn.disabled || reduce) return;
    const r = btn.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    const dot = document.createElement("span");
    dot.className = "mx-ripple";
    dot.style.width = dot.style.height = size + "px";
    dot.style.left = (e.clientX - r.left - size / 2) + "px";
    dot.style.top = (e.clientY - r.top - size / 2) + "px";
    btn.appendChild(dot);
    setTimeout(() => dot.remove(), 650);
  });

  /* 3. Bouton d'envoi : roue qui tourne + barre pendant l'envoi. */
  document.querySelectorAll("form").forEach((form) => {
    form.addEventListener("submit", (e) => {
      setTimeout(() => {
        if (e.defaultPrevented) return;
        const btn = form.querySelector("button[type=submit], button:not([type])");
        if (!btn || btn.classList.contains("mx-loading")) return;
        btn.classList.add("mx-loading");
        if (form.id === "uploadForm") {
          btn.innerHTML = '<span class="mx-spinner" aria-hidden="true"></span>' + btn.textContent.trim();
        }
      }, 0);
    });
  });
  // Retour arrière du navigateur : on remet les boutons à l'état normal.
  window.addEventListener("pageshow", () => {
    document.querySelectorAll(".btn.mx-loading").forEach((b) => {
      b.classList.remove("mx-loading");
      const s = b.querySelector(".mx-spinner"); if (s) s.remove();
    });
  });

  /* 4. Boutons « Copier » : « Copié ✓ » pendant un instant. */
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("button[onclick*='copy']");
    if (!btn) return;
    const old = btn.dataset.mxLabel || btn.textContent.trim();
    btn.dataset.mxLabel = old;
    btn.textContent = {{ ("Copié ✓" if (current_lang or "fr") == "fr" else "Copied ✓")|tojson }};
    btn.classList.remove("mx-copied"); void btn.offsetWidth; btn.classList.add("mx-copied");
    clearTimeout(btn._mxTimer);
    btn._mxTimer = setTimeout(() => { btn.textContent = old; btn.classList.remove("mx-copied"); }, 1600);
  });

  /* 5. Zone de dépôt : petit rebond quand un fichier est choisi. */
  const dz = document.getElementById("dropzone");
  const input = document.getElementById("fileInput");
  if (dz && input) {
    const bump = () => { dz.classList.remove("mx-picked"); void dz.offsetWidth; dz.classList.add("mx-picked"); };
    input.addEventListener("change", bump);
    dz.addEventListener("drop", bump);
  }

  /* 6. Les messages de réussite disparaissent seuls après quelques secondes. */
  document.querySelectorAll(".flash-stack .alert-success").forEach((al) => {
    setTimeout(() => { al.classList.add("mx-out"); setTimeout(() => al.remove(), 450); }, 6000);
  });
})();
</script>
{%- endmacro %}
