{% extends "base.html" %}
{% block sr_h1 %}{% endblock %}
{% set title = error_title %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 560px;">
  <div class="card shadow-sm text-center">
    <div class="card-body py-4">
      <div class="display-6 text-muted mb-2">{{ code }}</div>
      <h1 class="h4 mb-2">{{ error_title }}</h1>
      <p class="text-muted mb-3">{{ error_text }}</p>
      <a class="btn btn-primary" href="{{ url_for('public.index') }}">Retour à l'accueil</a>
    </div>
  </div>
</div>
{% endblock %}
