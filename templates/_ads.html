{# Emplacement publicitaire : rien du tout si la page n'a pas de publicité. #}
{% macro ad_slot(ads, name) %}
{% if ads and ads.slots.get(name) %}
{% set s = ads.slots[name] %}
<aside class="pxs-ad pxs-ad-{{ name }}" aria-label="Publicité">
  <div class="pxs-ad-label">Publicité</div>
  {% if s.mode == "google" %}
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ ads.client }}" data-ad-slot="{{ s.ad_slot }}"
       data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(window.adsbygoogle = window.adsbygoogle || []).push({});</script>
  {% else %}
  <a href="{{ url_for('ads.click', name=name) }}" rel="sponsored noopener" target="_blank">
    <img src="{{ url_for('ads.banner', name=name) }}" alt="{{ s.alt or 'Publicité' }}" loading="lazy" decoding="async">
  </a>
  {% endif %}
</aside>
{% endif %}
{% endmacro %}
