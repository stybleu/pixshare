{% extends "base.html" %}
{% block sr_h1 %}{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 480px;">
  <h1 class="h4 mb-3">Confirmer mon adresse</h1>
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <p>{% if already %}Cette adresse est déjà confirmée.{% else %}Dernière étape pour activer ton compte :{% endif %}</p>
      <p class="fw-semibold text-break">{{ email }}</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="btn btn-primary btn-lg w-100" type="submit">{% if already %}Me connecter{% else %}Confirmer et activer mon compte{% endif %}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
