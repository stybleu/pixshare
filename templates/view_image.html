<!doctype html>
<html lang="{{ current_lang or 'fr' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, noimageindex, nofollow">
<title>{{ original_name }} – PixShare</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<style>
  html, body { margin: 0; min-height: 100%; background: #0e0e10; color: #ddd; font: 14px system-ui, sans-serif; }
  .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; box-sizing: border-box; }
  img { max-width: 100%; max-height: calc(100vh - 90px); object-fit: contain; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; }
  a { color: #9cc3ff; }
  summary { cursor: pointer; color: #ff8a8a; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  form { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
  select, button { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid #555; background: #1c1c20; color: #eee; }
  button { background: #b3261e; border-color: #b3261e; color: #fff; cursor: pointer; }
  .flash { background: #1f3d2a; color: #c8f2d4; padding: 6px 10px; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  {% with messages = get_flashed_messages() %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  <a href="{{ raw_url }}"><img src="{{ raw_url }}" alt="{{ original_name }}"></a>
  <div class="bar">
    <a href="{{ url_for('public.image_page', file_id=file_id) }}">Page de l'image</a>
    <a href="{{ url_for('public.index') }}">PixShare</a>
    <details>
      <summary>⚑ Signaler</summary>
      <form method="post" action="{{ url_for('public.report_file', file_id=file_id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="back" value="view">
        <select name="reason" aria-label="Motif du signalement" required>
          {% for value, label in report_reasons %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
        </select>
        <button type="submit">Envoyer</button>
      </form>
    </details>
  </div>
</div>
</body>
</html>
