{% extends "base.html" %}
{% block sr_h1 %}{% endblock %}
{% set title = _("contact") %}
{% block content %}

<div class="container py-4" style="max-width: 760px;">
  <h1 class="h4 mb-3">{{ _("contact_report") }}</h1>

  <div class="card shadow-sm">
    <div class="card-body">

      <p class="text-muted">
        {{ _("contat_info_use") }}
      </p>

      <form method="post" class="row g-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="file_url" value="{{ prefill_file_url }}">

        <div class="col-12">
          <label class="form-label">{{ _("contact_type_message") }}</label>
          <select aria-label="{{ _("contact_type_message") }}" name="type" class="form-select">
            <option value="contact" {% if prefill_type == "contact" %}selected{% endif %}>{{ _("contact") }}</option>
            <option value="report" {% if prefill_type == "report" %}selected{% endif %}>{{ _("contact_report") }}</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">{{ _("name_optional") }}</label>
          <input aria-label="{{ _("name_optional") }}" type="text" name="name" class="form-control" maxlength="200">
        </div>

        <div class="col-md-6">
          <label class="form-label">{{ _("email_optional") }}</label>
          <input aria-label="{{ _("email_optional") }}" type="email" name="email" class="form-control" maxlength="200">
        </div>

        {% if prefill_file_url %}
        <div class="col-12">
          <label class="form-label">URL concernée</label>
          <input aria-label="URL concernée" type="text" class="form-control" value="{{ prefill_file_url }}" readonly>
        </div>
        {% endif %}

        <div class="col-12">
          <label class="form-label">Sujet</label>
          <input aria-label="Sujet"
            type="text"
            name="subject"
            class="form-control"
            value="{{ prefill_subject }}"
            required>
        </div>

        <div class="col-12">
          <label class="form-label">{{ _("message") }}</label>
          <textarea aria-label="{{ _("message") }}"
            maxlength="5000"
            name="message"
            class="form-control"
            rows="6"
            placeholder="{{ _("message_description") }}"
            required></textarea>
        </div>

        <div class="col-12">
          {% if turnstile_site_key %}
            <div class="cf-turnstile mb-2" data-sitekey="{{ turnstile_site_key }}" data-language="{{ current_lang or 'fr' }}" data-theme="auto"></div>
            <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
            {% endif %}
          <button type="submit" class="btn btn-primary">
            {{ _("send") }}
          </button>
        </div>
      </form>

    </div>
  </div>
</div>

{% endblock %}
