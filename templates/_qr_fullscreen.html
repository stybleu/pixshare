{# QR code en plein écran : UNE fenêtre par page, remplie par le bouton touché.
   Bouton : <button type="button" data-qr-open data-qr-src="…svg" data-qr-png="…png" data-qr-title="…" data-qr-note="…">. #}
<div class="qr-full" id="qrFull" role="dialog" aria-modal="true" aria-labelledby="qrFullTitle" hidden>
  <div class="qr-full-inner">
    <div class="qr-full-title" id="qrFullTitle"></div>
    <img class="qr-full-code" id="qrFullCode" src="data:," alt="">
    <div class="qr-full-hint">Scannez avec l'appareil photo du téléphone</div>
    <div class="qr-full-note" id="qrFullNote" hidden></div>
    <div class="qr-full-actions">
      <a class="btn btn-outline-dark" id="qrFullPng" href="#" download>⬇ Télécharger le QR code</a>
      <button type="button" class="btn btn-dark" data-qr-close>Fermer</button>
    </div>
  </div>
</div>

<style>
  .qr-full { position: fixed; inset: 0; z-index: 2000; background: #fff; color: #111;
             display: flex; align-items: center; justify-content: center; padding: 16px; }
  .qr-full[hidden] { display: none; }
  .qr-full-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; max-width: 100%; }
  .qr-full-title { font-weight: 700; font-size: 1.15rem; max-width: 90vw; overflow-wrap: anywhere; }
  .qr-full-code { width: min(84vw, 70vh); height: min(84vw, 70vh); image-rendering: pixelated; background: #fff; }
  .qr-full-hint { font-size: 1rem; color: #333; }
  .qr-full-note { font-size: .9rem; color: #555; }
  .qr-full-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .qr-open img { background: #fff; border-radius: 4px; }
</style>

<script>
(function () {
  "use strict";
  var box = document.getElementById("qrFull");
  if (!box) return;
  var lock = null, opener = null;
  function open(btn) {
    opener = btn;
    var title = btn.getAttribute("data-qr-title") || "PixShare", note = btn.getAttribute("data-qr-note") || "";
    document.getElementById("qrFullTitle").textContent = title;
    var img = document.getElementById("qrFullCode");
    img.src = btn.getAttribute("data-qr-src"); img.alt = "QR code : " + title;
    document.getElementById("qrFullPng").href = btn.getAttribute("data-qr-png");
    var n = document.getElementById("qrFullNote"); n.textContent = note; n.hidden = !note;
    box.hidden = false;
    document.body.style.overflow = "hidden";
    // Plein écran (si le navigateur le permet) et écran gardé allumé pendant qu'on le montre.
    try { if (box.requestFullscreen) box.requestFullscreen().catch(function () {}); } catch (e) {}
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (l) { lock = l; }).catch(function () {}); } catch (e) {}
    box.querySelector("[data-qr-close]").focus();
  }
  function close() {
    if (box.hidden) return;
    box.hidden = true;
    document.body.style.overflow = "";
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    try { if (lock) lock.release(); } catch (e) {}
    lock = null;
    if (opener && opener.focus) opener.focus();
  }
  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("[data-qr-open]");
    if (btn) { e.preventDefault(); open(btn); }
  });
  box.querySelector("[data-qr-close]").addEventListener("click", close);
  box.addEventListener("click", function (e) { if (e.target === box) close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  document.addEventListener("fullscreenchange", function () { if (!document.fullscreenElement) close(); });
})();
</script>
